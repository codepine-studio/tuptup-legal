<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Правові документи TupTup</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: #111111;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body { line-height: 1.7; }
      .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
      .top-link {
        display: inline-block;
        margin-bottom: 20px;
        color: #0a66c2;
        text-decoration: none;
        font-size: 14px;
      }
      .top-link:hover { text-decoration: underline; }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 20px;
      }
      .topbar .top-link { margin-bottom: 0; }
      h1 { font-size: 32px; line-height: 1.2; margin: 0 0 24px; }
      h2 { font-size: 20px; line-height: 1.3; margin: 24px 0 12px; }
      p { margin: 0 0 10px; font-size: 16px; color: #333333; }
      .bullet { padding-left: 8px; }
      .spacer { height: 12px; }
      .summary {
        margin: 0 0 10px;
        padding: 16px 18px;
        background: #f5f8fa;
        border-left: 3px solid #0a66c2;
        font-size: 16px;
        color: #222222;
      }
      .footer {
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid #eeeeee;
        font-size: 14px;
        color: #666666;
      }
      ul { padding-left: 20px; }
      li { margin-bottom: 10px; }
      a { color: #0a66c2; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <a class="top-link" href="../index.html" hreflang="en">English</a>
      <h1>TupTup</h1>
      <p>Правові документи та підтримка</p>

      <ul>
        <li><a href="./privacy.html">Політика конфіденційності</a></li>
        <li><a href="./terms.html">Умови використання</a></li>
        <li><a href="./support.html">Підтримка</a></li>
      </ul>
    </main>
  </body>
</html>
